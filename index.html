<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting to YouTube...</title>
    <script>
        // Tries to force-open the native YouTube app immediately
        window.location.href = "youtube://://youtube.com";
        
        // Fallback to the web version if they don't have the app installed
        setTimeout(function() {
            window.location.href = "https://youtube.com";
        }, 1500);
    </script>
</head>
<body>
    <p style="font-family: sans-serif; text-align: center; margin-top: 50px;">
        Opening in YouTube... If it doesn't open automatically, 
        <a href="https://youtube.com">click here</a>.
    </p>
</body>
</html>
